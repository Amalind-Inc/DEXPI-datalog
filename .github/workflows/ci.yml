name: CI

# ADR 0016 names feature skew as the expected failure mode of the hosted
# epic: hosted grows capability, the local path rots into a demo, and the
# standalone product becomes theatre. The test job therefore runs the same
# suite under both deployment profiles from this slice onward, before the
# hosted capabilities it has to keep honest exist.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runners are pinned, not "latest": the Souffle package below is built for
  # one Ubuntu release, and ruff's default rule set widens between versions.
  # A drifting runner turns an unrelated commit into a red build.
  SOUFFLE_VERSION: "2.5"
  SOUFFLE_SHA512: "6b86e554f6aa5abf8a8b55d8312ae37c0957c5bd6c9edeea89246db9406f645ec5e600b84fe6636b1c163da556f0da6c3d2dad46c1083413f2fcf4f95b9ac62c"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Only ruff is needed to lint, so this job skips the submodules and the
      # project install entirely and stays fast.
      - run: pip install "ruff==0.16.0"
      - run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-24.04
    strategy:
      # Both legs always run. Cancelling the sibling on first failure is what
      # hides "green locally, red hosted" -- the exact signal this job exists
      # to produce.
      fail-fast: false
      matrix:
        profile: [local, hosted]
    services:
      # There is no in-process libSQL, so the hosted leg needs a real server.
      # The local leg ignores it. Object storage is started as a step below
      # rather than here: the MinIO image needs `server /data` as arguments,
      # which a service container cannot pass, and the bucket has to be
      # created before the suite runs.
      libsql:
        image: ghcr.io/tursodatabase/libsql-server:latest
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v4
        with:
          # pyDEXPI does the XML-to-graph extraction and is not on PyPI;
          # TrainingTestCases holds the DEXPI fixtures the suite reads.
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-node@v4
        # Not for the frontend, which has its own job below. The Better Auth
        # contract test drives the real issuer to check that the tokens it
        # mints verify in Python, and it skips without node -- a skip nobody
        # would notice, on the one test covering a cross-language boundary.
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Souffle
        # Souffle is a native binary the verification layer shells out to, so
        # it cannot come from pip. The PPA is unmaintained upstream; the
        # release .deb is pinned by version and checked by digest so a
        # re-uploaded asset fails loudly instead of changing the engine under
        # the rule tests.
        run: |
          set -euo pipefail
          deb="x86_64-ubuntu-2404-souffle-${SOUFFLE_VERSION}-Linux.deb"
          url="https://github.com/souffle-lang/souffle/releases/download/${SOUFFLE_VERSION}/${deb}"
          curl --fail --location --silent --show-error --output "$deb" "$url"
          echo "${SOUFFLE_SHA512}  ${deb}" | sha512sum --check --strict
          sudo apt-get install --yes "./${deb}"
          souffle --version

      - name: Install project
        # The hosted extras (libsql, boto3) are installed only on the hosted
        # leg. That makes the local leg a standing proof of the OSS promise in
        # ADR 0016: a standalone install is standard-library only, and no
        # import path reachable from the local profile may reach for either.
        env:
          EXTRAS: ${{ matrix.profile == 'hosted' && 'dev,hosted' || 'dev' }}
        run: |
          set -euo pipefail
          pip install -e ./pyDEXPI
          pip install -e ".[${EXTRAS}]"

      - name: Start object storage
        # Hosted only: the local leg must run with no object store reachable,
        # which is what a standalone install looks like. A step rather than a
        # service because the image takes `server /data` as arguments and the
        # bucket has to exist before the suite starts.
        if: matrix.profile == 'hosted'
        run: |
          set -euo pipefail
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null
          python - <<'PY'
          import boto3
          from botocore.config import Config

          client = boto3.client(
              "s3",
              endpoint_url="http://127.0.0.1:9000",
              aws_access_key_id="minioadmin",
              aws_secret_access_key="minioadmin",
              region_name="us-east-1",
              config=Config(
                  signature_version="s3v4", s3={"addressing_style": "path"}
              ),
          )
          client.create_bucket(Bucket="pydexpi-ci")
          print("bucket created")
          PY

      - name: Run the suite under the ${{ matrix.profile }} profile
        # PYDEXPI_QA_PROVIDER=scripted is the existing hermeticity switch: it
        # forces the deterministic zero-LLM providers so the real turn
        # transport is exercised without any model call or credential.
        #
        # The benchmark suite is deselected by `-m "not slow"`. It is a
        # ten-minute measurement suite, and it currently carries one real
        # failure tracked as bead pydexpi-datalog-1-plz7 (synthetic
        # truth-by-construction disagrees with real Souffle). Wiring it in
        # while it is red would train everyone to ignore this badge. Bead
        # pydexpi-datalog-1-hawf adds it once plz7 is fixed.
        #
        # The backend variables are set only on the hosted leg, matching where
        # the packages are installed. The local leg therefore runs with no
        # libSQL and no object store reachable at all, which is the condition
        # a standalone user installs into.
        #
        # `PYDEXPI_BYOK_SECRET` is deliberately absent: it is configuration
        # rather than a service, and tests/conftest.py supplies a fixed one so
        # a developer needs no extra setup. That the hosted profile refuses to
        # boot without it is asserted directly, in test_provider_key_profiles.
        #
        # `CI` is set by Actions, which stops tests/conftest.py from turning a
        # missing backend into a skip. A broken service has to look different
        # from a passing run.
        env:
          PYDEXPI_DEPLOYMENT_PROFILE: ${{ matrix.profile }}
          PYDEXPI_QA_PROVIDER: scripted
          PYDEXPI_LIBSQL_URL: ${{ matrix.profile == 'hosted' && 'http://127.0.0.1:8080' || '' }}
          PYDEXPI_LIBSQL_TEST_URL: ${{ matrix.profile == 'hosted' && 'http://127.0.0.1:8080' || '' }}
          PYDEXPI_S3_BUCKET: ${{ matrix.profile == 'hosted' && 'pydexpi-ci' || '' }}
          PYDEXPI_S3_TEST_BUCKET: ${{ matrix.profile == 'hosted' && 'pydexpi-ci' || '' }}
          PYDEXPI_S3_ENDPOINT_URL: ${{ matrix.profile == 'hosted' && 'http://127.0.0.1:9000' || '' }}
          PYDEXPI_S3_TEST_ENDPOINT: ${{ matrix.profile == 'hosted' && 'http://127.0.0.1:9000' || '' }}
          PYDEXPI_S3_ACCESS_KEY_ID: ${{ matrix.profile == 'hosted' && 'minioadmin' || '' }}
          PYDEXPI_S3_SECRET_ACCESS_KEY: ${{ matrix.profile == 'hosted' && 'minioadmin' || '' }}
        run: pytest -m "not slow"

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # `oxlint` is enforced; `oxfmt --check` is not run. It currently fails on
      # 53 pre-existing files, and a step that cannot fail would be worse than
      # no step: it reads green while checking nothing. Reformatting the tree
      # and enforcing the formatter is its own change, tracked separately.
      - run: npx oxlint
        working-directory: frontend

  # The quickstart is a claim the README makes to every new reader, so CI has
  # to hold it. This builds the real image and drives the composed stack the
  # way a first-time user would: sign up, save a credential, prepare a review
  # from a real DEXPI file, and confirm the artifacts landed in the bucket.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # pyDEXPI is a submodule and the image installs it. Without this the
          # build fails exactly as it does for someone who forgets the flag.
          submodules: recursive
      - name: Build the image
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Wait for the app to answer
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://localhost:3000/sign-in; then
              echo "app is up"; exit 0
            fi
            sleep 5
          done
          echo "app never came up"; docker compose logs app; exit 1
      - name: Sign up, save a credential, run a review
        run: |
          set -euo pipefail
          jar=$(mktemp)

          # Auth is enforced: the review API must refuse an anonymous caller.
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:3000/api/review/sessions)
          [ "$code" = "401" ] || { echo "expected 401, got $code"; exit 1; }

          curl --silent --fail --cookie-jar "$jar" \
            --request POST http://localhost:3000/api/auth/sign-up/email \
            --header 'content-type: application/json' \
            --data '{"email":"ci@example.com","password":"a-long-enough-password","name":"ci"}' \
            --output /dev/null

          # Proves the generated PYDEXPI_BYOK_SECRET encrypts and decrypts.
          curl --silent --fail --cookie "$jar" \
            --request PUT http://localhost:3000/api/provider-keys/openrouter \
            --header 'content-type: application/json' \
            --data '{"model":"openai/gpt-4.1","credential":"sk-or-ci-canary"}' \
            --output /dev/null
          curl --silent --fail --cookie "$jar" http://localhost:3000/api/provider-keys \
            | grep -q openrouter || { echo "saved credential did not come back"; exit 1; }

          # A real DEXPI file through the real pipeline, which needs Souffle.
          fixture="TrainingTestCases/dexpi 1.3/example pids/E06 Pump, HeatExchanger, Nozzles Connected With PNS/E06V01-VER.EX01.xml"
          python3 -c "
          import json, pathlib, sys
          print(json.dumps({'filename': 'E06V01-VER.EX01.xml',
                            'content': pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')}))
          " "$fixture" > /tmp/prepare.json

          curl --silent --fail --cookie "$jar" \
            --request POST http://localhost:3000/api/review/sessions/ci-smoke/prepare \
            --header 'content-type: application/json' \
            --data @/tmp/prepare.json --output /tmp/prepared.json
          grep -q '"status":"ready"' /tmp/prepared.json \
            || { echo "prepare did not report ready"; cat /tmp/prepared.json; exit 1; }
      - name: Artifacts reached the bucket
        run: |
          set -euo pipefail
          docker compose exec -T app python - <<'PY'
          import os
          import sys

          import boto3
          from botocore.config import Config

          client = boto3.client(
              "s3",
              endpoint_url=os.environ["PYDEXPI_S3_ENDPOINT_URL"],
              aws_access_key_id=os.environ["PYDEXPI_S3_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["PYDEXPI_S3_SECRET_ACCESS_KEY"],
              region_name="us-east-1",
              config=Config(s3={"addressing_style": "path"}),
          )
          keys = [
              item["Key"]
              for item in client.list_objects_v2(
                  Bucket=os.environ["PYDEXPI_S3_BUCKET"]
              ).get("Contents", [])
          ]
          print("\n".join(keys))
          # The Souffle program is the one that proves the engine ran, rather
          # than the upload merely being echoed back.
          for expected in ("graph_facts.json", "derived_graph_semantics.dl"):
              if not any(key.endswith(expected) for key in keys):
                  print(f"missing {expected} in the bucket", file=sys.stderr)
                  raise SystemExit(1)
          PY
      - name: Accounts and credentials survive a restart
        run: |
          set -euo pipefail
          docker compose down
          docker compose up -d
          for _ in $(seq 1 60); do
            curl --silent --fail --output /dev/null http://localhost:3000/sign-in && break
            sleep 5
          done
          jar=$(mktemp)
          # Sign IN, not up: the account has to have outlived the container.
          curl --silent --fail --cookie-jar "$jar" \
            --request POST http://localhost:3000/api/auth/sign-in/email \
            --header 'content-type: application/json' \
            --data '{"email":"ci@example.com","password":"a-long-enough-password"}' \
            --output /dev/null
          curl --silent --fail --cookie "$jar" http://localhost:3000/api/provider-keys \
            | grep -q openrouter \
            || { echo "credential did not survive the restart"; exit 1; }
      - name: Logs on failure
        if: failure()
        run: docker compose logs
