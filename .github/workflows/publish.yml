# Build the image here so small hosts never have to.
#
# `npm ci` plus a Next production build needs more memory than a 1 GB server
# has, and the failure there is a killed process with no useful message. A
# runner has 16 GB and costs nothing for a public repository, so the server's
# job is reduced to pulling a layer.
#
# Tags: `main` follows the default branch, a semver tag publishes `1.2.3`,
# `1.2` and `latest`, and every build carries its commit sha.

name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Lets you rebuild a tag without pushing a commit, e.g. after a base image
  # security update.
  workflow_dispatch:

concurrency:
  # A second push while one is building makes the first result stale.
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Required for the GITHUB_TOKEN to write to the registry. Narrower than
      # a personal access token, and it expires with the job.
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # pyDEXPI is a submodule the image installs; without this the build
          # fails the same way it does for someone who forgets the flag.
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Souffle publishes no arm64 binary, so there is no second platform
          # to build for. Stated here rather than discovered by someone whose
          # arm64 pull fails at runtime.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry: the Souffle and npm layers dominate
          # the build and rarely change.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report what was published
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
