<!doctype html>
<html><head><style>

.row{display:flex;gap:8px;padding:0 8px 16px}
.cell{flex:1;background:#fff;border:1px solid #ccc}
.cell img,.cell object{width:100%;height:auto;display:block}
</style></head><body>
<h2 id="title"></h2>

  <div class="cell"><object id="ref" type="image/svg+xml"></object></div>

<script>
const q = new URLSearchParams(location.search);
const fixture = q.get("f") || "C01";
const refs = {
  C01: "../../../TrainingTestCases/dexpi 1.3/example pids/C01 DEXPI Reference P&ID/C01V04-VER.EX01.svg",
  C02: "../../../TrainingTestCases/dexpi 1.3/example pids/C02 Process Column (BASF)/C02V03-VER.EX02.svg",

};

document.getElementById("ref").data = encodeURI(refs[fixture]);
</script>
</body></html>
