# Production overlay. Use together with the base file, never alone:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The base file is a laptop default: it publishes a MinIO console with a known
# password and serves plain HTTP on localhost, which is right for trying the
# tool and wrong on a public host. This overlay closes both, terminates TLS,
# and removes every credential default so a missing secret stops the deploy
# instead of quietly becoming a published password.
#
# Required in the environment or a `.env` beside this file:
#
#   PYDEXPI_PUBLIC_HOST   the domain, e.g. pid.example.com
#   BETTER_AUTH_URL       https://$PYDEXPI_PUBLIC_HOST
#   TLS_CONTACT_EMAIL     for the certificate authority's expiry warnings
#   MINIO_ROOT_USER       object storage user
#   MINIO_ROOT_PASSWORD   object storage password
#
# `?err` rather than `:-default`: Compose fails with the message when the
# variable is unset, which is the entire point of this file.

services:
  app:
    # Reachable only through the proxy. Publishing 3000 as well would leave a
    # plaintext route past TLS that nothing warns you about.
    ports: !override []
    environment:
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set it to the public https URL}
      PYDEXPI_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?required}
      PYDEXPI_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?required}
      # Generated into the state volume on first boot when unset, which is
      # fine for one instance. Set them from a secret manager to control
      # rotation, or to move the deployment to another host without losing
      # every session and every saved model credential.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      PYDEXPI_BYOK_SECRET: ${PYDEXPI_BYOK_SECRET:-}
    restart: always

  minio:
    # The console is an admin UI over every review artifact. Reach it through
    # an SSH tunnel when it is needed:
    #   ssh -L 9001:127.0.0.1:9001 you@host
    ports: !override
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    restart: always

  libsql:
    restart: always

  # Terminates TLS and gets certificates from Let's Encrypt automatically.
  # Caddy rather than nginx here because the certificate lifecycle is the
  # whole job, and Caddy does it without a companion container or a cron job.
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PYDEXPI_PUBLIC_HOST: ${PYDEXPI_PUBLIC_HOST:?set it to your domain}
      TLS_CONTACT_EMAIL: ${TLS_CONTACT_EMAIL:?required for certificate notices}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and account keys. Losing this volume means re-issuing on
      # every restart, which Let's Encrypt rate-limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: always

volumes:
  caddy-data:
  caddy-config:
