id: compare_known_object_reachability
status: supported_deterministic
question: Compare reachable targets and downstream_reference targets from a known source object.
description: >-
  Given a deterministic source object selector, compare recursive
  candidate-topology reachability with direct downstream_reference targets so
  users can inspect whether the derived graph utility layer is too broad or too
  narrow.
determinism:
  required: true
  source_of_truth: deterministic_query_output
  current_engine: souffle
  future_engine_candidates:
    - ergoai
  llm_may_not_answer_without_deterministic_output: true
requires:
  facts:
    - derived_graph_semantics.dl
  predicates:
    - node
    - node_label
    - reachable
    - downstream_reference
inputs:
  - name: source_selector
    kind: deterministic_node_selector
    required: true
    accepted_selectors:
      - source_id
      - source_tag
      - source_proteus_id
outputs:
  result_sets:
    - reachable_targets
    - downstream_reference_targets
  include_labels: true
llm_roles:
  allowed:
    - classify_question
    - route_to_deterministic_query
    - explain_deterministic_results
  disallowed:
    - produce_compliance_answer
    - invent_missing_query_results
    - bypass_deterministic_execution
