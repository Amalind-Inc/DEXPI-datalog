id: classify_all_pump_discharge_paths
status: future_candidate
question: Classify all centrifugal pump discharge paths in the P&ID.
description: >-
  Evaluate every centrifugal pump in the P&ID and classify whether each discharge
  path satisfies the pump discharge-path rule family. This is a whole-P&ID query
  because it discovers its own pump subjects instead of starting from one source
  selector.
query_scope:
  kind: whole_pid
determinism:
  required: true
  source_of_truth: deterministic_query_output
  current_engine: souffle
  future_engine_candidates:
    - ergoai
  llm_may_not_answer_without_deterministic_output: true
requires:
  available_predicates:
    - node
    - node_label
    - reachable
  missing_predicates:
    - centrifugal_pump
    - discharge_nozzle
    - first_unbranched_downstream_segment
    - branch_boundary
    - check_valve_on_discharge_segment
inputs: []
outputs:
  candidate_result_sets:
    - pump_discharge_path_classifications
    - pump_discharge_path_findings
llm_roles:
  allowed:
    - classify_question
    - route_to_deterministic_query
    - explain_deterministic_results
  disallowed:
    - produce_compliance_answer
    - invent_missing_query_results
    - bypass_deterministic_execution
