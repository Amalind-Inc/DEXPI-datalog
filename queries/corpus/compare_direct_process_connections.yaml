id: compare_direct_process_connections
status: supported_deterministic
question: Compare experimental direct_process_connection targets against downstream_reference and reachable targets from a known source object.
description: >-
  Given a deterministic source object selector, compare the experimental
  process-facing direct_process_connection predicate with lower-level
  downstream_reference and recursive reachable results so reviewers can judge
  whether the predicate is narrower, broader, or equivalent on representative
  fixtures.
determinism:
  required: true
  source_of_truth: deterministic_query_output
  current_engine: souffle
  future_engine_candidates:
    - ergoai
  llm_may_not_answer_without_deterministic_output: true
requires:
  facts:
    - derived_graph_semantics.dl
  predicates:
    - node
    - node_label
    - direct_process_connection
    - downstream_reference
    - reachable
inputs:
  - name: source_selector
    kind: deterministic_node_selector
    required: true
    accepted_selectors:
      - source_id
      - source_tag
      - source_proteus_id
outputs:
  result_sets:
    - direct_process_connection_targets
    - downstream_reference_targets
    - reachable_targets
  comparison_summary: true
  include_labels: true
llm_roles:
  allowed:
    - classify_question
    - route_to_deterministic_query
    - explain_deterministic_results
  disallowed:
    - produce_compliance_answer
    - invent_missing_query_results
    - bypass_deterministic_execution
