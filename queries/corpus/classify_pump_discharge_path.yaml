    - derived_graph_semantics.dl
  available_predicates:
    - node
    - node_label
    - node_tag
    - node_proteus_id
    - reachable
    - downstream_reference
  missing_predicates:
    - discharge_nozzle
    - first_unbranched_downstream_segment
    - branch_boundary
    - inline_continuity_item
    - check_valve_on_discharge_segment
outputs:
  unsupported_diagnostic: true
  explains_missing_capability: predicate_library_work_required
llm_roles:
  allowed:
    - classify_question
    - route_to_unsupported_diagnostic
    - explain_missing_predicates
  disallowed:
    - produce_compliance_answer
    - infer_discharge_path_without_query_output
    - bypass_deterministic_execution
