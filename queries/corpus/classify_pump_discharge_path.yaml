id: classify_pump_discharge_path
status: unsupported_missing_predicates
unsupported_reason: unsupported_missing_predicates
question: Classify the discharge path downstream of a centrifugal pump.
description: >-
  Determine the first unbranched downstream discharge segment for a centrifugal
  pump and classify whether the path satisfies the expected discharge protection
  shape. This is the near-term north-star query, but it needs additional derived
  graph predicates before it can execute deterministically.
query_scope:
  kind: source_rooted
determinism:
  required: true
  source_of_truth: deterministic_query_output
  current_engine: souffle
  future_engine_candidates:
    - ergoai
  llm_may_not_answer_without_deterministic_output: true
requires:
